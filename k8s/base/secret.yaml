# ------------------------------------------------------------------
# 【重要】这是一个占位模板，不是可用的 Secret 管理方案。
#
# 把明文密码提交进 Git 是最常见的供应链事故来源之一 ——
# 一旦提交，即使后来删除，它也已经留在 Git 历史、CI 日志、
# 以及所有克隆过这个仓库的开发者机器上，只能靠轮换密钥来补救。
#
# 生产环境的几种正确做法：
#
#   1. External Secrets Operator
#      从 Vault / AWS Secrets Manager / 阿里云 KMS 拉取，同步成 k8s Secret。
#      密钥不落 Git，轮换由后端系统统一管理。多集群场景下最合适。
#
#   2. Sealed Secrets
#      用集群公钥加密后提交密文，只有目标集群能解密。
#      适合 GitOps 流程，但密钥轮换仍需重建 SealedSecret。
#
#   3. SOPS + age/KMS
#      在 Git 里存加密文件，由 CI 或 ArgoCD 解密。
#      好处是可以对单个字段做 diff，code review 时能看出改了什么。
#
#   4. 云厂商托管的 Secret 注入（如 AWS Secrets Store CSI Driver）
#      密钥以文件形式挂载进 Pod，完全不经过 etcd。
#
# 本 demo 选择占位 + 说明，是因为仓库要公开，
# 且真实的密钥管理方案依赖具体的基础设施。
# 面试时这里要能说清楚「为什么不能这么做」以及「你们打算怎么做」。
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: order-demo-api-secret
  labels:
    app.kubernetes.io/name: order-demo-api
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # 演示用占位值。真实环境由 External Secrets 从密钥管理系统注入，
  # 或在部署时用 CI 的 Secret 覆盖，绝不写进仓库。
  DB_USERNAME: "orders"
  DB_PASSWORD: "CHANGE_ME_use_external_secrets"
