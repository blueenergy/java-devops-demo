# ------------------------------------------------------------------
# 【重要】这是演示用的 PostgreSQL，不是生产可用的数据库部署。
#
# 单副本、无流复制、无备份、无 PITR、密码来自 Secret 占位。
# 生产环境应当：
#   - 用云托管数据库（RDS / 阿里云 RDS / Aurora），把高可用、备份、
#     补丁、监控这些责任交给云厂商 —— 自建数据库的运维成本远高于托管费用
#   - 或在集群内用 Operator（CloudNativePG / Zalando Postgres Operator），
#     由 Operator 管理主从切换、备份、故障恢复
#
# 这里手写一个单副本 Deployment 的目的是让 demo 能在任意 kind 集群里
# 一条命令跑起来，不依赖任何 Operator。
# 面试时这里要能说清「为什么 demo 这么做」以及「生产会怎么做」。
# ------------------------------------------------------------------
# 凭据不再单独定义 —— 数据库通过 secretKeyRef 引用应用那份
# order-demo-db-credentials（见 secret.yaml）。
# 曾经两边各写一份字面量，结果密码不一致，应用连不上库且只在运行期暴露。
# 单一来源让这类错误在物理上不可能发生。

---
apiVersion: v1
kind: Service
metadata:
  name: order-demo-postgres
  labels:
    app.kubernetes.io/name: order-demo-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: order-demo-postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-demo-postgres
  labels:
    app.kubernetes.io/name: order-demo-postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  # Recreate 而不是 RollingUpdate：RWO 卷不能被两个 Pod 同时挂载，
  # RollingUpdate 会让新 Pod 卡在 ContainerCreating 等旧 Pod 释放卷。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: order-demo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-demo-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # postgres 官方镜像里的 postgres 用户 uid
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          # 与数据库同名的变量通过 secretKeyRef 从共享凭据映射过来，
          # 保证应用侧与数据库侧用的永远是同一份密码。
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: order-demo-db-credentials
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-demo-db-credentials
                  key: DB_PASSWORD
            # PGDATA 指到子目录是官方镜像的要求：
            # 直接挂载到 /var/lib/postgresql/data 时，挂载点下的 lost+found
            # 会让 initdb 认为目录非空而拒绝初始化。
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-demo-postgres-data
        - name: run
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-demo-postgres-data
  labels:
    app.kubernetes.io/name: order-demo-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
