# CI 专用叠加层：给 GitHub Actions 里的 kind 集群用。
#
# 与 dev 的区别：
#   1. 镜像用 kind load 预载的本地 tag，不推送到任何 registry
#   2. 去掉 NetworkPolicy —— kind 默认的 kindnet CNI 不实现 NetworkPolicy，
#      对象会被 API Server 接受但静默不生效。留着会造成
#      「以为已经做了网络隔离」的错觉，不如显式去掉并说明原因。
#   3. 单副本，kind 节点资源有限
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: order-demo

resources:
  - ../../base

labels:
  - pairs:
      env: ci
    includeSelectors: false

# kind load docker-image 把镜像直接塞进节点，不需要 registry。
# 用 :ci 这个 tag 与本地开发用的 :local 区分开。
images:
  - name: order-demo-api
    newName: order-demo-api
    newTag: ci

# 副本数用 patch 而不是 replicas: —— 后者不匹配 Rollout 这个 CRD，
# 渲染期就会报 "does not match a config with GVK [Deployment ...]"
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: order-demo-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # kind 的 kindnet 不实现 NetworkPolicy，去掉避免误导。
  # 注意每个删除 patch 都必须写【准确的资源名】：
  # $patch: delete 是按 apiVersion/kind/name 精确匹配的，
  # 写一个不存在的名字（比如占位的 "unused"）会导致
  # "no matches for Id ..." 渲染失败。
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress

  - target:
      kind: NetworkPolicy
      name: order-demo-api-allow-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: order-demo-api-allow-ingress

  - target:
      kind: NetworkPolicy
      name: order-demo-api-allow-egress-postgres
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: order-demo-api-allow-egress-postgres

  # 单副本下 PDB 的 minAvailable: 2 永远无法满足，
  # 会让任何节点排水操作被无限阻塞
  - target:
      kind: PodDisruptionBudget
      name: order-demo-api
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: order-demo-api

  # 单副本不需要 HPA
  - target:
      kind: HorizontalPodAutoscaler
      name: order-demo-api
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: order-demo-api

  # kind 集群资源有限，调小配额避免调度失败。
  #
  # 必须用 JSON6902（op/path）而不是 strategic merge 风格的补丁。
  # 原因：Rollout 是 CRD，kustomize 没有它的 OpenAPI 字段元数据，
  # 于是把补丁当作 JSON merge 处理 —— **数组是整体替换，不是按 name 合并**。
  # 写成 containers: [{name: ..., resources: ...}] 会把整个容器列表替换掉，
  # image、ports、三类探针、securityContext 全部丢失。
  # 症状是 Rollout 报 InvalidSpec: containers[0].image: Required value。
  #
  # 这类错误静态 YAML 校验看不出来（kubeconform 对 CRD 直接跳过），
  # 只有渲染后检查字段、或真正 apply 到集群才会暴露。
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: order-demo-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 640Mi
