name: CD

# 手动触发为主，因为这是一个【演示】流水线：
# 它会在 GitHub runner 里起一个真实的 kind 集群，跑完整的
# 金丝雀发布 + 故障注入 + 自动回滚，整个过程 10-15 分钟。
# 挂在每次 push 上会浪费额度，且和 CI 的定位重叠。
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: '要演示的场景'
        type: choice
        required: true
        default: both
        options:
          - canary-success
          - canary-rollback
          - both
  push:
    tags: ['v*.*.*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # 部署不能被打断，否则集群会停在中间状态

permissions:
  contents: read

env:
  ARGO_ROLLOUTS_VERSION: v1.10.1
  KIND_CLUSTER_NAME: order-demo
  NAMESPACE: order-demo
  IMAGE: order-demo-api:ci

jobs:
  canary-demo:
    name: 金丝雀发布与自动回滚
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # ================================================================
      # 环境准备
      # ================================================================

      - name: 创建 kind 集群
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          # 固定 kind 版本，避免上游更新导致演示行为漂移
          version: v0.33.0
          # 关掉默认的 local-path provisioner 也行，但 PostgreSQL 需要 PVC，
          # kind 自带的 local-path provisioner 已能满足，保持默认。
          wait: 120s

      - name: 安装 Argo Rollouts
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # 关键：argoproj/argo-rollouts 不是一个 GitHub Action。
          #
          # 很容易误写成 `uses: argoproj/argo-rollouts@v1.10.1` ——
          # 该仓库根目录没有 action.yml，这样写会在流水线启动时直接报
          # "Can't find 'action.yml'"，且错误信息不会提示你「这不是一个 Action」。
          #
          # 正确做法是下载官方 install.yaml 用 kubectl 应用。
          # ------------------------------------------------------------------
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -

          # ------------------------------------------------------------------
          # 必须用 --server-side（服务端 apply）。
          #
          # Rollout 的 CRD 非常大。客户端 apply 会把整个清单塞进
          # kubectl.kubernetes.io/last-applied-configuration 注解，
          # 而注解有 262144 字节上限，于是直接失败：
          #   CustomResourceDefinition "rollouts.argoproj.io" is invalid:
          #   metadata.annotations: Too long: may not be more than 262144 bytes
          #
          # 服务端 apply 由 API Server 管理字段归属，不写这个注解，
          # 因此不受限制。这是安装大型 CRD 的标准做法。
          # ------------------------------------------------------------------
          kubectl apply --server-side --force-conflicts -n argo-rollouts \
            -f "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/install.yaml"
          kubectl -n argo-rollouts rollout status deployment/argo-rollouts --timeout=180s

      - name: 安装 kubectl-argo-rollouts 插件
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # CRD 装好只让集群认识 Rollout 资源；
          # `kubectl argo rollouts ...` 这条子命令来自一个独立的 kubectl 插件，
          # 不装的话会报 "unknown command"，而不是提示你缺插件。
          # ------------------------------------------------------------------
          curl -sSL -o /tmp/kubectl-argo-rollouts \
            "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          chmod +x /tmp/kubectl-argo-rollouts
          sudo mv /tmp/kubectl-argo-rollouts /usr/local/bin/
          kubectl argo rollouts version

      - name: 构建镜像
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}" .
          # 同一份构建产物再打一个 ci-v2 tag。
          # 场景 A 用它来制造一次「镜像更新」，从而触发真正的金丝雀发布
          # （restart 只重启 Pod，不会创建新 revision —— 见 docs/06）。
          # 两个 tag 内容完全相同：演示的是发布流程，不是代码差异。
          docker tag "${IMAGE}" order-demo-api:ci-v2
          docker images "order-demo-api"

      - name: 预载镜像到 kind 节点
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # 关键：GHCR 的包默认是私有的，kind 节点里没有 imagePullSecret，
          # 直接部署会卡在 ImagePullBackOff。
          # `kind load` 把镜像直接塞进节点，完全绕过 registry ——
          # 这是 CI 里验证 K8s 部署最快也最可靠的方式。
          # ------------------------------------------------------------------
          kind load docker-image "${IMAGE}" --name "${KIND_CLUSTER_NAME}"
          # 场景 A 用的 tag 也要预载，否则 apply 后 Pod 会 ImagePullBackOff
          kind load docker-image order-demo-api:ci-v2 --name "${KIND_CLUSTER_NAME}"

      # ================================================================
      # 部署初始版本（v1，健康）
      # ================================================================

      - name: 应用 K8s 清单
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/ci

      - name: 等待 PostgreSQL 就绪
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" rollout status deployment/order-demo-postgres --timeout=180s

      - name: 等待 v1 发布完成
        run: |
          set -euo pipefail
          # 初始部署也要等健康，否则后续的金丝雀演示会建立在错误的前提上
          kubectl argo rollouts status order-demo-api -n "${NAMESPACE}" --timeout 300s

      - name: 记录 v1 基线状态
        run: |
          set -euo pipefail
          {
            echo "## 基线：v1 已就绪"
            echo ""
            echo '```'
            kubectl argo rollouts get rollout order-demo-api -n "${NAMESPACE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ================================================================
      # 场景 A：金丝雀发布成功
      # ================================================================

      - name: "场景 A：触发一次正常发布"
        if: inputs.scenario == 'canary-success' || inputs.scenario == 'both' || github.event_name == 'push'
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # 用【镜像更新】触发一次真正的金丝雀发布：
          #   ci-release overlay 只把 image tag 从 ci 换成 ci-v2。
          #
          # 为什么不用 kubectl argo rollouts restart：
          #   restart 设置的是 Rollout 的 spec.restartAt —— 它只重启 Pod，
          #   **不创建新 ReplicaSet / revision**，因此金丝雀步骤根本不会执行。
          #   实测证据：restart 后 status.currentStepIndex 一直停在 6（终态），
          #   且 42 秒就 Healthy —— 而配置里两个 pause 各 30 秒，时间上根本不够。
          #   那演示的是「滚动重启」，不是「金丝雀发布」。
          #
          # 为什么不用 kubectl set env：
          #   CRD 不在 kubectl 客户端 scheme 里，直接报
          #   no kind "Rollout" is registered ... in scheme。
          #
          # 注意：只改 ConfigMap【不会】触发 Rollout —— 它只监听 pod template。
          # ------------------------------------------------------------------
          kubectl apply -k k8s/overlays/ci-release

      - name: "场景 A：观察金丝雀逐步放量"
        if: inputs.scenario == 'canary-success' || inputs.scenario == 'both' || github.event_name == 'push'
        run: |
          set -euo pipefail
          # 每 5 秒采样一次 Rollout 状态，把放量过程记录下来作为演示证据
          # 注意不要打印 .status.canary.weights：那是 trafficRouting 才填充的字段，
          # 没有流量路由器时它永远是空的（打印出来只有 "%"）。
          # 改为打印步骤序号与副本数 —— 在副本比例模式下，这才是放量的真实指标。
          for i in $(seq 1 24); do
            PHASE=$(kubectl -n "${NAMESPACE}" get rollout order-demo-api \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "-")
            # 注意路径是 .status.currentStepIndex（顶层），不是 .status.canary...
            STEP=$(kubectl -n "${NAMESPACE}" get rollout order-demo-api \
              -o jsonpath='{.status.currentStepIndex}' 2>/dev/null || echo "-")
            UPDATED=$(kubectl -n "${NAMESPACE}" get rollout order-demo-api \
              -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo "-")
            READY=$(kubectl -n "${NAMESPACE}" get rollout order-demo-api \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "-")
            echo "[$i] step=${STEP} updated=${UPDATED} ready=${READY} phase=${PHASE}"
            if [ "${PHASE}" = "Healthy" ]; then
              echo "✓ 金丝雀发布完成，已全量切换到新版本"
              break
            fi
            sleep 5
          done

          kubectl argo rollouts status order-demo-api -n "${NAMESPACE}" --timeout 120s

      - name: "场景 A：记录成功证据"
        if: inputs.scenario == 'canary-success' || inputs.scenario == 'both' || github.event_name == 'push'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## 场景 A：金丝雀发布成功"
            echo ""
            echo '```'
            kubectl argo rollouts get rollout order-demo-api -n "${NAMESPACE}"
            echo ""
            echo "--- AnalysisRun 列表 ---"
            kubectl -n "${NAMESPACE}" get analysisrun
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ================================================================
      # 场景 B：故障注入 → 金丝雀分析失败 → 自动回滚
      # ================================================================

      - name: "场景 B：发布一个「坏」版本"
        if: inputs.scenario == 'canary-rollback' || inputs.scenario == 'both'
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # 用声明式 overlay 注入故障：k8s/overlays/ci-fault 在 ci 的基础上
          # 给 pod template 加 FAULT_ENABLED=true / FAULT_ERROR_RATE=0.5。
          #
          # 为什么用 apply -k 而不是改 ConfigMap：
          #   1) 只改 ConfigMap 不会触发新 revision（Rollout 只监听 pod template）
          #   2) 故障写进 pod template 后，只存在于新 ReplicaSet 的 Pod 里，
          #      正在服务的 stable Pod 完全不受影响 —— 这才是真实的金丝雀语义
          #
          # 为什么用 overlay 而不是 kubectl set env / merge patch：
          #   set env 不支持 CRD；merge patch 会把 containers 数组整体替换
          #   （image/探针一并丢失）。apply 走 unstructured 路径，对 CRD 安全。
          #
          # FAULT_ENABLED 只影响 /api/**，刻意绕开 /actuator/**，
          # 所以新 Pod 能正常就绪、正常接流量，
          # 由 AnalysisTemplate 通过业务接口探测到 500 —— 而非启动失败。
          # ------------------------------------------------------------------
          echo "发布带故障的新版本（50% 请求返回 500）..."
          kubectl apply -k k8s/overlays/ci-fault

      - name: "场景 B：观察自动回滚"
        if: inputs.scenario == 'canary-rollback' || inputs.scenario == 'both'
        run: |
          set -euo pipefail
          # 期望的结果是 Rollout 进入 Degraded / 回滚，所以这里不能因为
          # 命令非零退出就中断 —— 那恰恰是我们要的成功路径。
          set +e
          for i in $(seq 1 36); do
            PHASE=$(kubectl -n "${NAMESPACE}" get rollout order-demo-api \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "-")
            # 用 jq 取「最近一条」AnalysisRun，而不是 jsonpath 的 .items[-1:]。
            # kubectl 的 jsonpath 对负索引/切片的支持并不可靠，
            # 不同版本下可能报错或返回空 —— 这类问题只在集群里才暴露。
            AR_PHASE=$(kubectl -n "${NAMESPACE}" get analysisrun -o json 2>/dev/null \
              | jq -r '.items | sort_by(.metadata.creationTimestamp) | if length > 0 then last.status.phase // "-" else "-" end')
            echo "[$i] rollout=${PHASE} analysisRun=${AR_PHASE}"
            if [ "${PHASE}" = "Degraded" ] || [ "${AR_PHASE}" = "Failed" ]; then
              echo "✓ 金丝雀分析判定失败，Rollout 已中止"
              break
            fi
            sleep 5
          done
          set -e

      - name: "场景 B：确认已回滚到稳定版本"
        if: inputs.scenario == 'canary-rollback' || inputs.scenario == 'both'
        run: |
          set -euo pipefail
          echo "--- Rollout 状态 ---"
          kubectl -n "${NAMESPACE}" get rollout order-demo-api \
            -o jsonpath='{.status.phase}{"\n"}{.status.canary.currentStepIndex}{"\n"}'

          echo "--- 回滚事件 ---"
          kubectl -n "${NAMESPACE}" describe rollout order-demo-api | grep -A3 -iE 'RolloutAborted|RolloutDegraded' || true

          # 验证稳定版本仍然可用 —— 这是回滚是否真正生效的最终判据。
          # 只看 Rollout 状态是不够的：状态为 Degraded 不代表服务已恢复，
          # 要实际打一次接口确认。
          #
          # --field-selector=status.phase=Running 是必要的：回滚瞬间可能还有
          # 正在终止的 canary Pod，直接取 items[0] 有可能 exec 到一个已死的 Pod 上，
          # 得到 "container not running" 这种与回滚无关的假失败。
          STABLE_POD=$(kubectl -n "${NAMESPACE}" get pods \
            -l app.kubernetes.io/name=order-demo-api \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "${NAMESPACE}" exec "${STABLE_POD}" -- \
            wget -qO- http://localhost:8080/actuator/health/readiness
          echo ""
          echo "✓ 稳定版本仍在正常服务"

      - name: "场景 B：记录回滚证据"
        if: inputs.scenario == 'canary-rollback' || inputs.scenario == 'both'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## 场景 B：故障注入触发自动回滚"
            echo ""
            echo "### Rollout 最终状态"
            echo '```'
            kubectl argo rollouts get rollout order-demo-api -n "${NAMESPACE}"
            echo '```'
            echo "### AnalysisRun（失败的那次）"
            echo '```'
            kubectl -n "${NAMESPACE}" get analysisrun -o wide
            echo ""
            LAST_AR=$(kubectl -n "${NAMESPACE}" get analysisrun -o json \
              | jq -r '.items | sort_by(.metadata.creationTimestamp) | last.metadata.name')
            kubectl -n "${NAMESPACE}" describe analysisrun "${LAST_AR}" | tail -30
            echo '```'
            echo "### 回滚事件"
            echo '```'
            kubectl -n "${NAMESPACE}" describe rollout order-demo-api | grep -iE 'abort|degrad|rollback' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ================================================================
      # 收尾
      # ================================================================

      - name: 汇总集群最终状态
        if: always()
        run: |
          {
            echo ""
            echo "## 集群最终状态"
            echo '```'
            kubectl -n "${NAMESPACE}" get rollout,rs,pods,svc,analysisrun -o wide 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时导出诊断信息
        if: failure()
        run: |
          echo "=== Rollout ==="
          kubectl -n "${NAMESPACE}" describe rollout order-demo-api 2>&1 | tail -60 || true
          echo "=== Pods ==="
          kubectl -n "${NAMESPACE}" describe pods 2>&1 | tail -80 || true
          echo "=== AnalysisRun ==="
          kubectl -n "${NAMESPACE}" describe analysisrun 2>&1 | tail -60 || true
          echo "=== Argo Rollouts controller 日志 ==="
          kubectl -n argo-rollouts logs deployment/argo-rollouts --tail=80 || true
