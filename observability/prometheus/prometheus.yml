# 本地开发用的 Prometheus 配置。
#
# 与 k8s 环境的区别：这里用 static_configs 直接写死目标地址；
# k8s 里用 ServiceMonitor + Prometheus Operator 做服务发现（见 k8s/base/servicemonitor.yaml），
# 因为 Pod 的 IP 会随重建变化，写死地址在动态环境里没有意义。

global:
  # 抓取间隔决定了指标的时间分辨率，也决定了告警的最快响应速度。
  # 15s 是精度与存储成本的常见折中：更快意味着 Prometheus 存储和查询压力线性上升。
  scrape_interval: 15s
  # 告警规则的求值频率。通常等于或大于 scrape_interval，
  # 比它更快没有意义——数据还没更新。
  evaluation_interval: 15s
  external_labels:
    env: local
    cluster: docker-compose

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  - job_name: 'order-demo-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: order-demo-api
          env: local
    # 应用刚启动时 actuator 可能还没就绪，给它一点容错
    scrape_timeout: 10s

  # Prometheus 自监控。排查「告警没触发」时，第一件事就是看 Prometheus 自己是否正常。
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
