# 专用 ServiceAccount，而不是用 default。
#
# 为什么不用 default：
#   同一个 namespace 里所有 Pod 默认共用 default ServiceAccount，
#   它的权限会被所有工作负载继承。一旦某个 Pod 被攻破，
#   攻击者拿到的就是「这个 namespace 里所有应用权限的并集」。
#
# automountServiceAccountToken: false 是关键一行。
#   本应用不需要访问 k8s API，那么就不该在容器里挂载 token。
#   挂载了 token 等于给容器内任意代码一把访问 API Server 的钥匙 ——
#   很多容器逃逸利用链的第一步就是读 /var/run/secrets/kubernetes.io/serviceaccount/token。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-demo-api
  labels:
    app.kubernetes.io/name: order-demo-api
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
